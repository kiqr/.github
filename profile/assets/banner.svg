<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="frame"><rect width="1280" height="420" rx="28"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(148,170,220,.16)"/></pattern>
    <radialGradient id="dotmask" cx="50%" cy="0%" r="80%"><stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="fade"><rect width="1280" height="420" fill="url(#dotmask)"/></mask>
    <linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#8b9cff"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="720" x2="1080"><stop offset="0" stop-color="#5eead4" stop-opacity=".7"/><stop offset="1" stop-color="#8b9cff" stop-opacity=".7"/></linearGradient>
    <path id="w0" d="M 836 210 C 920 210, 940 76, 1010 76"/>
    <path id="w1" d="M 836 210 C 920 210, 940 126, 1010 126"/>
    <path id="w2" d="M 836 210 C 920 210, 940 176, 1010 176"/>
    <path id="w3" d="M 836 210 C 920 210, 940 286, 1010 286"/>
    <path id="w4" d="M 836 210 C 920 210, 940 336, 1010 336"/>
    <path id="win" d="M 650 210 C 690 210, 720 210, 764 210"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="#05070d"/>
    <ellipse cx="160" cy="10" rx="320" ry="200" fill="rgba(94,234,212,.30)" filter="url(#blur)"/>
    <ellipse cx="1120" cy="80" rx="360" ry="230" fill="rgba(139,156,255,.30)" filter="url(#blur)"/>
    <ellipse cx="640" cy="450" rx="300" ry="160" fill="rgba(196,181,253,.14)" filter="url(#blur)"/>
    <rect width="1280" height="420" fill="url(#dots)" mask="url(#fade)"/>

    <!-- wordmark -->
    <g transform="translate(72 56) scale(1.6)">
      <path d="M7 18 C 11 18, 15 8, 19 8" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
      <rect x="3" y="14.5" width="7" height="7" rx="2" fill="#d7ff43"/>
      <circle cx="19.5" cy="8" r="4" fill="#8b9cff"/>
    </g>
    <text x="124" y="84" fill="#eef2fb" font-size="24" font-weight="700" letter-spacing="1">KIQR</text>

    <text x="76" y="158" fill="#5eead4" font-size="15" font-weight="600" letter-spacing="2.4">OPEN SOURCE · RUNS LOCALLY</text>
    <text x="72" y="222" fill="#eef2fb" font-size="52" font-weight="700" letter-spacing="-2">The CMO that lives</text>
    <text x="72" y="284" fill="url(#grad)" font-size="52" font-weight="700" letter-spacing="-2">on your machine.</text>
    <text x="76" y="334" fill="#9aa6bf" font-size="19">We build Seemo: it learns your business, plans the</text>
    <text x="76" y="362" fill="#9aa6bf" font-size="19">marketing, does the work and reads the numbers.</text>

    <!-- connect: your website in, Seemo in the middle, the apps out -->
    <g fill="none" stroke="url(#wire)" stroke-width="1.6">
      <use href="#win"/><use href="#w0"/><use href="#w1"/><use href="#w2"/><use href="#w3"/><use href="#w4"/>
    </g>
    <g fill="#5eead4" filter="url(#glow)">
      <circle r="3"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#win"/></animateMotion></circle>
      <circle r="2.6"><animateMotion keyPoints="1;0" keyTimes="0;1" calcMode="linear" dur="2.6s" repeatCount="indefinite"><mpath href="#w0"/></animateMotion></circle>
      <circle r="2.6"><animateMotion keyPoints="1;0" keyTimes="0;1" calcMode="linear" dur="2.9s" begin="-.7s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
      <circle r="2.6"><animateMotion keyPoints="1;0" keyTimes="0;1" calcMode="linear" dur="3.2s" begin="-1.4s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
      <circle r="2.8" fill="#d7ff43"><animateMotion dur="2.8s" begin="-.4s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
      <circle r="2.8" fill="#d7ff43"><animateMotion dur="3.4s" begin="-1.6s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>
    </g>

    <!-- your website -->
    <g transform="translate(578 174)">
      <rect width="72" height="72" rx="18" fill="rgba(16,22,38,.8)" stroke="rgba(148,170,220,.22)"/>
      <circle cx="36" cy="36" r="15" fill="none" stroke="#9aa6bf" stroke-width="1.6"/>
      <path d="M21 36h30M36 21c5 5 5 25 0 30M36 21c-5 5-5 25 0 30" fill="none" stroke="#9aa6bf" stroke-width="1.6"/>
      <text x="36" y="98" fill="#9aa6bf" font-size="13" text-anchor="middle">your website</text>
    </g>

    <!-- Seemo -->
    <circle cx="800" cy="210" r="50" fill="rgba(139,156,255,.14)">
      <animate attributeName="r" values="40;56;40" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0;.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="210" r="36" fill="rgba(16,22,38,.92)" stroke="rgba(148,170,220,.3)"/>
    <rect x="789" y="199" width="22" height="22" rx="6" fill="#d7ff43"/>
    <text x="800" y="274" fill="#eef2fb" font-size="14" font-weight="600" text-anchor="middle">Seemo</text>

    <!-- apps -->
    <g font-size="14" fill="#eef2fb">
      <text x="1014" y="46" fill="#66728c" font-size="11.5" font-weight="600" letter-spacing="1.8">READS THE NUMBERS</text>
      <g transform="translate(1010 58)"><rect width="190" height="36" rx="18" fill="rgba(16,22,38,.8)" stroke="rgba(148,170,220,.22)"/><circle cx="20" cy="18" r="4" fill="#5eead4"/><text x="34" y="23">Google Analytics</text></g>
      <g transform="translate(1010 108)"><rect width="190" height="36" rx="18" fill="rgba(16,22,38,.8)" stroke="rgba(148,170,220,.22)"/><circle cx="20" cy="18" r="4" fill="#5eead4"/><text x="34" y="23">Search Console</text></g>
      <g transform="translate(1010 158)"><rect width="190" height="36" rx="18" fill="rgba(16,22,38,.8)" stroke="rgba(148,170,220,.22)"/><circle cx="20" cy="18" r="4" fill="#5eead4"/><text x="34" y="23">Plausible</text></g>
      <text x="1014" y="256" fill="#66728c" font-size="11.5" font-weight="600" letter-spacing="1.8">PUBLISHES THE WORK</text>
      <g transform="translate(1010 268)"><rect width="190" height="36" rx="18" fill="rgba(16,22,38,.8)" stroke="rgba(148,170,220,.22)"/><circle cx="20" cy="18" r="4" fill="#d7ff43"/><text x="34" y="23">WordPress</text></g>
      <g transform="translate(1010 318)"><rect width="190" height="36" rx="18" fill="rgba(16,22,38,.8)" stroke="rgba(148,170,220,.22)"/><circle cx="20" cy="18" r="4" fill="#d7ff43"/><text x="34" y="23">Email</text></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="419" rx="27.5" fill="none" stroke="rgba(148,170,220,.18)"/>
</svg>
